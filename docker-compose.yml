services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postcode
      POSTGRES_PASSWORD: postcode
      POSTGRES_DB: postcode
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postcode"]
      interval: 3s
      retries: 10

volumes:
  pgdata:
