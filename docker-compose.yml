services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postcode
      POSTGRES_PASSWORD: postcode
      POSTGRES_DB: postcode
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postcode"]
      interval: 3s
      retries: 10

  # change 007: redis + arq-воркер — только в профиле jobs
  # (docker compose --profile jobs up)
  redis:
    image: redis:7-alpine
    profiles: [jobs]
    ports:
      - "6379:6379"

  worker:
    image: postcode-planner:latest
    build:
      context: .
    profiles: [jobs]
    depends_on:
      - redis
    command: uv run arq src.ai.jobs_worker.WorkerSettings
    env_file:
      - path: .env
        required: false   # воркер тоже ходит в LLM (нормализация, change 027)
    healthcheck:
      disable: true
    environment:
      POSTCODE_DATABASE_URL: postgresql+asyncpg://postcode:postcode@db:5432/postcode
      POSTCODE_REDIS_URL: redis://redis:6379/0
      POSTCODE_JOBS_MODE: queue
      # change 028: воркер исполняет прогон solver'а (run_optimization_job)
      POSTCODE_OPTIMIZER_BASE_URL: http://optimizer:8080
    volumes:
      # change 030: русский CA Минцифры для LLM-вызовов нормализации из воркера
      - /etc/nixos/certs:/etc/nixos/certs:ro
      # change 037: общий tmp — файлы, загруженные api
      - jobs-tmp:/tmp/planner-uploads

  # change 018: solver-сайдкар Timefold — только в профиле optimizer
  # (docker compose --profile optimizer up)
  optimizer:
    build:
      context: ./optimizer
      # VPN-окружение: Maven Central доступен только через host-сеть при сборке
      network: host
    profiles: [optimizer]
    expose:
      - "8080"
    environment:
      OPTIMIZER_PORT: 8080
      OPTIMIZER_SEED: 42
      # change 029: бюджет 180 с + unimproved 30 с — время довести до hard=0
      OPTIMIZER_TIME_LIMIT_SECONDS: 180
      OPTIMIZER_UNIMPROVED_LIMIT_SECONDS: 30
      OPTIMIZER_STAFFING_GAIN_THRESHOLD: 0.05
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 3s
      retries: 20

  # связка сервисом — бэк и фронт в контейнерах
  # (docker compose up — поднимает всё: db + api + frontend)
  api:
    image: postcode-planner:latest
    build:
      context: .
    env_file:
      - path: .env
        required: false   # LLM/прочие POSTCODE_* переменные (шаблон — example.env)
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      POSTCODE_DATABASE_URL: postgresql+asyncpg://postcode:postcode@db:5432/postcode
      POSTCODE_OPTIMIZER_BASE_URL: http://optimizer:8080
      # очередь тяжёлых операций (change 028): solver/LLM через arq; redis в профиле jobs,
      # недоступность — деградация в синхронный режим
      POSTCODE_REDIS_URL: redis://redis:6379/0
    volumes:
      # change 030: русский CA Минцифры на хосте — до LLM-вызовов SDK из контейнера
      # (GIGACHAT_CA_BUNDLE в .env указывает на тот же путь)
      - /etc/nixos/certs:/etc/nixos/certs:ro
      # change 037: общий tmp для upload-файлов — воркер читает файлы api
      - jobs-tmp:/tmp/planner-uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_started
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  pgdata:
  jobs-tmp:
