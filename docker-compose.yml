services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postcode
      POSTGRES_PASSWORD: postcode
      POSTGRES_DB: postcode
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postcode"]
      interval: 3s
      retries: 10

  # change 007: redis + arq-воркер — только в профиле jobs
  # (docker compose --profile jobs up)
  redis:
    image: redis:7-alpine
    profiles: [jobs]
    ports:
      - "6379:6379"

  worker:
    image: postcode-planner:latest
    profiles: [jobs]
    depends_on:
      - redis
    command: arq src.ai.jobs_worker.WorkerSettings
    environment:
      POSTCODE_DATABASE_URL: postgresql+asyncpg://postcode:postcode@db:5432/postcode
      POSTCODE_REDIS_URL: redis://redis:6379/0
      POSTCODE_JOBS_MODE: queue

  # change 004+ : связка сервисом — бэк и фронт в контейнерах
  # (docker compose up — поднимает всё: db + api + frontend)
  api:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      POSTCODE_DATABASE_URL: postgresql+asyncpg://postcode:postcode@db:5432/postcode
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_started
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  pgdata:
