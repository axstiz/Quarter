# Статика SPA + прокси на бэк (как vite.config.ts: /api, /auth, /workspaces, /permissions)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 64m;
    }
    location /auth/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location /workspaces/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location /permissions/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # SPA: любые пути отдаём index.html (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
