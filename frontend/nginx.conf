# Статика SPA + прокси на бэк (как vite.config.ts: /api, /auth, /workspaces, /permissions)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Host с портом ($http_host): редиректы FastAPI (trailing slash) должны
    # сохранять внешний порт, иначе браузер уходит на :80
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 64m;
    }
    location /auth/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
    }
    # без trailing slash — иначе /workspaces (без слэша) уходит в SPA/index.html,
    # а FastAPI отвечает редиректом 307, который теряет порт
    location /workspaces {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
    }
    location /permissions {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
    }

    # SPA: любые пути отдаём index.html (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
