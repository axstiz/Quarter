[project]
name = "postcode-planner"
version = "0.1.0"
description = "Квартальное планирование команд и звёздная карта (PostCode Challenge)"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "aiosqlite>=0.20,<1",
    "alembic>=1.14,<2",
    "pydantic-settings>=2.7,<3",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.9,<1",
    "langgraph>=0.2,<1",
    "gigachat>=0.1,<1",
    "bcrypt>=5.0.0",
    "arq>=0.28.0",
]

[tool.pytest.ini_options]
markers = [
    "solver: тяжёлые docker-compose тесты optimizer (поднимают профиль optimizer, минуты) — не в общем прогоне",
]
addopts = "-m 'not solver'"

[tool.uv]
package = false
